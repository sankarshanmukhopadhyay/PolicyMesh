name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - name: Install project and validation dependencies
        run: pip install -e ".[dev]"
      - name: Verify test-client dependency contract
        run: |
          python -c "import httpx2; from starlette.testclient import TestClient; print(\"Starlette TestClient dependency contract OK\")"
      - run: pytest
      - run: python scripts/validate_repository.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: artifacts/validation/
